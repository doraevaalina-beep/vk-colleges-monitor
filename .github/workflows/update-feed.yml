name: Update VK feed

on:
  workflow_dispatch:
  schedule:
    # Every hour. GitHub cron uses UTC.
    - cron: "15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vk-feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fontconfig libcairo2

      - name: Install
        run: pip install -r requirements.txt

      - name: Ensure rolling image release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view vk-images >/dev/null 2>&1; then
            gh release create vk-images \
              --title "VK post images" \
              --notes "Automatic rolling mirror of original VK post photos used by the feed."
          fi
          if ! gh release view mlspo-visuals >/dev/null 2>&1; then
            gh release create mlspo-visuals \
              --title "MLSPO visuals" \
              --notes "Automatic rolling storage for current MLSPO visual cards."
          fi

      - name: Restore current VK photos for Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p docs/images
          gh release download vk-images --dir docs/images || true
          echo "Restored $(find docs/images -maxdepth 1 -type f | wc -l) photo(s)"

      - name: Restore current MLSPO visuals for Pages and reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p docs/visuals
          gh release download mlspo-visuals --dir docs/visuals || true
          echo "Restored $(find docs/visuals -maxdepth 1 -type f -name '*.png' | wc -l) visual(s)"

      - name: Fetch VK posts and original photos
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_SITE_BASE: https://doraevaalina-beep.github.io/vk-colleges-monitor
        run: python editorial_runner.py

      - name: Upload new original VK photos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(.image_uploads/*)
          if (( ${#files[@]} )); then
            gh release upload vk-images "${files[@]}" --clobber
            echo "Uploaded ${#files[@]} photo(s)"
          else
            echo "No new photos to upload"
          fi

      - name: Remove old image assets no longer in 72-hour feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/vk-images" --jq '.id')
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' | \
          while IFS=$'\t' read -r asset_id asset_name; do
            if ! grep -Fq "$asset_name" docs/feed.json; then
              echo "Deleting old image asset: $asset_name"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done

      - name: Publish rolling MLSPO visuals
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t names < <(jq -r '.built_visual_files[]' docs/health.json)
          files=()
          for name in "${names[@]}"; do
            [[ -f "docs/visuals/$name" ]] && files+=("docs/visuals/$name")
          done
          if (( ${#files[@]} )); then
            gh release upload mlspo-visuals "${files[@]}" --clobber
            echo "Published ${#files[@]} new or changed visual(s)"
          else
            echo "No new or changed visuals to publish"
          fi

          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/mlspo-visuals" --jq '.id')
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' | \
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ ! -f "docs/visuals/$asset_name" ]]; then
              echo "Deleting old visual asset: $asset_name"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done

      - name: Save state and public feed
        run: |
          git config user.name "vk-feed-bot"
          git config user.email "vk-feed-bot@users.noreply.github.com"
          git add state.json docs/feed.json docs/feed.xml docs/health.json
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Update VK feed"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
