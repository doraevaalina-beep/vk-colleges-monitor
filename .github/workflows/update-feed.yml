name: Update VK feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch VK posts
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: python monitor.py

      - name: Save state and public feed
        run: |
          git config user.name "vk-feed-bot"
          git config user.email "vk-feed-bot@users.noreply.github.com"
          git add state.json docs/feed.json docs/feed.xml docs/health.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update VK feed"
            git push
          fi
